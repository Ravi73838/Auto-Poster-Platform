name: Contract Sync & Boundaries

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  validate-contract:
    name: Check Contract Sync & Architecture Boundaries
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: api/package-lock.json

      - name: Install API dependencies
        working-directory: api
        run: npm ci

      - name: Verify Contract Purity & Synchronization
        working-directory: api
        run: npm run sync:shared:check

      - name: Verify Architecture Boundaries (No cross-app leakage)
        working-directory: api
        run: npm run check:boundaries
